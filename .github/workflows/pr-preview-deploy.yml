name: Deploy PR Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '📦 PR Preview'

      - name: Get local time
        id: time
        run: echo "datetime=$(TZ='Australia/Brisbane' date +'%a %d %b %Y, %I:%M %p %Z')" >> $GITHUB_OUTPUT

      - name: Get changed recipe links
        id: recipe-links
        run: |
          BASE_URL="https://adroz.github.io/recipe-database/pr-preview/pr-${{ github.event.pull_request.number }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- '*.md' | grep '^docs/' | grep -v 'docs/index\.md' | head -5)

          if [ -z "$CHANGED" ]; then
            echo 'links=' >> $GITHUB_OUTPUT
            exit 0
          fi

          OUTPUT="**Changed recipes:**"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            URL_PATH="${file#docs/}"
            URL_PATH="${URL_PATH%.md}/"
            NAME=$(python3 -c "import sys; print(' '.join(w.capitalize() for w in sys.argv[1].replace('-', ' ').split()))" "$(basename "$file" .md)")
            OUTPUT="${OUTPUT}"$'\n'"- [${NAME}](${BASE_URL}/${URL_PATH})"
          done <<< "$CHANGED"

          {
            echo 'links<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## 📦 PR Preview

            Your preview site is ready!

            🔗 **Preview URL:** https://adroz.github.io/recipe-database/pr-preview/pr-${{ github.event.pull_request.number }}/

            ${{ steps.recipe-links.outputs.links }}

            <sub>This preview was built from commit ${{ github.event.pull_request.head.sha }} at ${{ steps.time.outputs.datetime }}</sub>
